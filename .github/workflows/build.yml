name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 buildozer 工具链（SDK/NDK）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer-cache
          key: bz-docker-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-docker-

      - name: 准备缓存目录
        run: |
          mkdir -p ~/.buildozer-cache
          chmod -R 777 ~/.buildozer-cache

      - name: 单元测试 + lint
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pytest ruff
          python3 -m pytest tests -q
          python3 -m ruff check src app_main.py main.py tests

      # 用 Kivy 官方维护的镜像：buildozer + p4a + SDK/NDK 版本组合已测试过
      - name: 生成源码种子包（代码外置用）
        run: |
          rm -f assets/seed.zip
          # 注意：assets/fonts 要一起打进去，热更后 code/assets/fonts/ 才有字体
          # 本地的 seed.zip 用 tools/pack_seed.sh 重打后提交；这里的产物只进 APK。
          # version.json 必须打进去：热更校验靠包内 build 判新旧，缺了会被判为旧包
          zip -rq assets/seed.zip app_main.py songgrab.kv version.json src assets/fonts \
              -x "*/__pycache__/*" "*.pyc"
          unzip -l assets/seed.zip | grep -q "version.json" || { echo "seed 缺 version.json"; exit 1; }
          echo "seed.zip: $(du -h assets/seed.zip | cut -f1)"
          echo "seed.zip sha256: $(sha256sum assets/seed.zip | cut -d' ' -f1)"
          unzip -l assets/seed.zip | tail -3

      - name: 写入签名 keystore
        run: |
          mkdir -p "$HOME/keys"
          echo "${{ secrets.SONGRAB_KEYSTORE_B64 }}" | base64 -d > "$HOME/keys/songgrab.p12"
          chmod 644 "$HOME/keys/songgrab.p12"
          ls -l "$HOME/keys/songgrab.p12"

      # release 构建 + 固定 keystore 签名：保证每次产出的 APK 签名一致，可覆盖升级
      - name: 构建 APK（release 签名）
        env:
          P4A_RELEASE_KEYSTORE: /tmp/keys/songgrab.p12
          P4A_RELEASE_KEYALIAS: ${{ secrets.SONGRAB_KEYALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.SONGRAB_KEYSTORE_PASS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.SONGRAB_KEYALIAS_PASS }}
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -v "$HOME/.buildozer-cache":/root/.buildozer \
            -v "$HOME/keys":/tmp/keys:ro \
            -e P4A_RELEASE_KEYSTORE -e P4A_RELEASE_KEYALIAS \
            -e P4A_RELEASE_KEYSTORE_PASSWD -e P4A_RELEASE_KEYALIAS_PASSWD \
            kivy/buildozer:latest android release

      - name: 修复文件属主
        if: always()
        run: sudo chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE" || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: songgrab-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer/android/platform/build-*/build/outputs/logs/
          if-no-files-found: ignore
