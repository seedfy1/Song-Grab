name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 buildozer 与 SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.cache/pip
          key: bz-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-${{ runner.os }}-

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Java 版本确认
        run: java -version

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer

      - name: 构建 APK
        run: buildozer -v android debug

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: songgrab-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer/android/platform/build-*/build/outputs/logs/
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
