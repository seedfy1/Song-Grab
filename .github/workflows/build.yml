name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 buildozer 工具链（SDK/NDK）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer-cache
          key: bz-docker-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-docker-

      - name: 准备缓存目录
        run: |
          mkdir -p ~/.buildozer-cache
          chmod -R 777 ~/.buildozer-cache

      # 用 Kivy 官方维护的镜像：buildozer + p4a + SDK/NDK 版本组合已测试过
      - name: 构建 APK
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -v "$HOME/.buildozer-cache":/root/.buildozer \
            kivy/buildozer:latest android debug

      - name: 修复文件属主
        if: always()
        run: sudo chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE" || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: songgrab-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer/android/platform/build-*/build/outputs/logs/
          if-no-files-found: ignore
